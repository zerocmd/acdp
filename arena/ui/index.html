<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACDP Arena Workbench</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <div id="root"></div>
  <div id="boot-error" class="boot-error" hidden></div>
  <script type="module">
    import("/ui/app.js").catch((e) => {
      const box = document.getElementById("boot-error");
      box.textContent = `The Workbench could not load its modules (${e.message}). Check access to cdn.jsdelivr.net, then reload.`;
      box.hidden = false;
    });
  </script>
</body>
</html>
